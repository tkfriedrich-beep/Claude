id: github
name: GitHub
version: 0.1.0
category: developer
description: >
  GitHub issues and repositories. MOCK in the MVP — returns clearly-labeled demo data until a
  real GitHub account is connected (roadmap).
auth_type: oauth (not configured — mock)
capabilities: [issues.read]
data_sensitivity: normal
default_mode: read_only
mock: true
tools:
  - id: github.list_issues
    name: List issues
    description: List repository issues (demo data while mocked)
    capability: issues.read
    access: read
    risk_level: R1
    input_schema:
      type: object
      properties: { repo: { type: string } }
      additionalProperties: false
    output_schema:
      type: object
      properties: { issues: { type: array }, demo: { type: boolean } }
      required: [issues]
    timeout_seconds: 15
