id: notion
name: Notion
version: 0.1.0
category: productivity
description: >
  Notion pages and databases. MOCK in the MVP — returns clearly-labeled demo data until a real
  Notion integration token is configured (roadmap).
auth_type: integration_token (not configured — mock)
capabilities: [pages.read]
data_sensitivity: normal
default_mode: read_only
mock: true
tools:
  - id: notion.search_pages
    name: Search pages
    description: Search Notion pages (demo data while mocked)
    capability: pages.read
    access: read
    risk_level: R1
    input_schema:
      type: object
      properties: { query: { type: string } }
      additionalProperties: false
    output_schema:
      type: object
      properties: { pages: { type: array }, demo: { type: boolean } }
      required: [pages]
    timeout_seconds: 15
