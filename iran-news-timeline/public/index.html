<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iran Crisis Timeline - Live News Tracker</title>
  <style>
    :root {
      --bg-dark: #0f1117;
      --bg-card: #1a1d27;
      --bg-card-hover: #222636;
      --border: #2a2e3d;
      --text-primary: #e4e6ef;
      --text-secondary: #8b8fa3;
      --accent-red: #e74c3c;
      --accent-blue: #3498db;
      --accent-orange: #e67e22;
      --accent-green: #2ecc71;
      --accent-purple: #9b59b6;
      --accent-yellow: #f1c40f;
      --accent-teal: #1abc9c;
      --timeline-line: #2a2e3d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-left h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .header-left h1 span {
      color: var(--accent-red);
    }

    .header-left p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--accent-red);
      font-weight: 600;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-red);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .stats span strong {
      color: var(--text-primary);
    }

    .refresh-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-blue);
    }

    .refresh-btn.loading {
      opacity: 0.6;
      pointer-events: none;
    }

    /* Filters */
    .filter-bar {
      max-width: 1200px;
      margin: 1rem auto;
      padding: 0 2rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .filter-chip:hover {
      border-color: var(--accent-blue);
      color: var(--text-primary);
    }

    .filter-chip.active {
      border-color: var(--accent-blue);
      background: rgba(52, 152, 219, 0.15);
      color: var(--accent-blue);
    }

    /* Main Content */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem 4rem;
    }

    /* Loading */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem;
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-screen p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Error */
    .error-banner {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--accent-red);
      font-size: 0.85rem;
      display: none;
    }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 2rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--timeline-line);
    }

    .timeline-date-group {
      margin-bottom: 2rem;
    }

    .timeline-date {
      position: relative;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1rem;
      padding: 0.4rem 0;
    }

    .timeline-date::before {
      content: '';
      position: absolute;
      left: -2rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      background: var(--accent-blue);
      border: 3px solid var(--bg-dark);
      border-radius: 50%;
    }

    .timeline-date .count {
      font-weight: 400;
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }

    .timeline-items {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .news-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      transition: all 0.2s;
      cursor: default;
    }

    .news-card:hover {
      background: var(--bg-card-hover);
      border-color: #3a3e4d;
      transform: translateX(4px);
    }

    .news-card::before {
      content: '';
      position: absolute;
      left: -1.65rem;
      top: 1.5rem;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid var(--bg-dark);
    }

    .news-card[data-category="military"]::before { background: var(--accent-red); }
    .news-card[data-category="diplomacy"]::before { background: var(--accent-blue); }
    .news-card[data-category="sanctions"]::before { background: var(--accent-orange); }
    .news-card[data-category="nuclear"]::before { background: var(--accent-purple); }
    .news-card[data-category="humanitarian"]::before { background: var(--accent-green); }
    .news-card[data-category="domestic"]::before { background: var(--accent-yellow); }
    .news-card[data-category="general"]::before { background: var(--accent-teal); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .card-title a {
      color: inherit;
      text-decoration: none;
    }

    .card-title a:hover {
      color: var(--accent-blue);
    }

    .category-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .category-badge.military { background: rgba(231, 76, 60, 0.15); color: var(--accent-red); }
    .category-badge.diplomacy { background: rgba(52, 152, 219, 0.15); color: var(--accent-blue); }
    .category-badge.sanctions { background: rgba(230, 126, 34, 0.15); color: var(--accent-orange); }
    .category-badge.nuclear { background: rgba(155, 89, 182, 0.15); color: var(--accent-purple); }
    .category-badge.humanitarian { background: rgba(46, 204, 113, 0.15); color: var(--accent-green); }
    .category-badge.domestic { background: rgba(241, 196, 15, 0.15); color: var(--accent-yellow); }
    .category-badge.general { background: rgba(26, 188, 156, 0.15); color: var(--accent-teal); }

    .card-summary {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 0.75rem;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .card-meta .source {
      font-weight: 600;
      color: var(--accent-blue);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
    }

    .empty-state h3 {
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header { padding: 1rem; }
      .header-content { flex-direction: column; align-items: flex-start; }
      .stats { flex-wrap: wrap; gap: 0.75rem; }
      .main { padding: 1rem; }
      .filter-bar { padding: 0 1rem; }
      .timeline { padding-left: 1.5rem; }
      .timeline-date::before { left: -1.5rem; width: 12px; height: 12px; }
      .news-card::before { left: -1.18rem; width: 6px; height: 6px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-left">
        <h1><span>Iran Crisis</span> News Timeline</h1>
        <p>Live aggregation from major news wires &mdash; February 2026</p>
      </div>
      <div class="header-right">
        <div class="live-indicator">
          <div class="live-dot"></div>
          LIVE
        </div>
        <div class="stats">
          <span><strong id="article-count">0</strong> articles</span>
          <span><strong id="feed-count">0</strong> sources</span>
          <span>Updated: <strong id="last-updated">--</strong></span>
        </div>
        <button class="refresh-btn" onclick="loadNews()" id="refresh-btn">Refresh</button>
      </div>
    </div>
  </header>

  <div class="filter-bar" id="filter-bar">
    <div class="filter-chip active" data-filter="all">All</div>
    <div class="filter-chip" data-filter="military">Military</div>
    <div class="filter-chip" data-filter="diplomacy">Diplomacy</div>
    <div class="filter-chip" data-filter="nuclear">Nuclear</div>
    <div class="filter-chip" data-filter="sanctions">Sanctions</div>
    <div class="filter-chip" data-filter="humanitarian">Humanitarian</div>
    <div class="filter-chip" data-filter="domestic">Domestic</div>
    <div class="filter-chip" data-filter="general">General</div>
  </div>

  <div class="error-banner" id="error-banner"></div>

  <main class="main" id="main">
    <div class="loading-screen" id="loading">
      <div class="spinner"></div>
      <p>Scanning news wires for Iran-related updates...</p>
    </div>
  </main>

  <script>
    let allArticles = [];
    let currentFilter = "all";

    // Format date for display
    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    }

    function formatTime(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function timeAgo(dateStr) {
      const now = new Date();
      const d = new Date(dateStr);
      const diffMs = now - d;
      const mins = Math.floor(diffMs / 60000);
      const hours = Math.floor(mins / 60);
      const days = Math.floor(hours / 24);
      if (mins < 1) return "just now";
      if (mins < 60) return mins + "m ago";
      if (hours < 24) return hours + "h ago";
      return days + "d ago";
    }

    function renderTimeline(articles) {
      const main = document.getElementById("main");

      if (articles.length === 0) {
        main.innerHTML = `
          <div class="empty-state">
            <h3>No articles found</h3>
            <p>No Iran-related news matched the current filter. Try selecting a different category or refreshing.</p>
          </div>`;
        return;
      }

      // Group by date
      const grouped = {};
      articles.forEach((a) => {
        const key = new Date(a.date).toISOString().split("T")[0];
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(a);
      });

      // Sort date keys descending
      const sortedDates = Object.keys(grouped).sort(
        (a, b) => new Date(b) - new Date(a)
      );

      let html = '<div class="timeline">';

      sortedDates.forEach((dateKey) => {
        const items = grouped[dateKey];
        html += `
          <div class="timeline-date-group">
            <div class="timeline-date">
              ${formatDate(dateKey)}
              <span class="count">${items.length} update${items.length !== 1 ? "s" : ""}</span>
            </div>
            <div class="timeline-items">`;

        items.forEach((item) => {
          html += `
              <div class="news-card" data-category="${item.category}">
                <div class="card-header">
                  <div class="card-title">
                    <a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">
                      ${escapeHtml(item.title)}
                    </a>
                  </div>
                  <span class="category-badge ${item.category}">${item.category}</span>
                </div>
                <div class="card-summary">${escapeHtml(item.summary)}</div>
                <div class="card-meta">
                  <span class="source">${escapeHtml(item.source)}</span>
                  <span>${formatTime(item.date)}</span>
                  <span>${timeAgo(item.date)}</span>
                </div>
              </div>`;
        });

        html += `
            </div>
          </div>`;
      });

      html += "</div>";
      main.innerHTML = html;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadNews() {
      const btn = document.getElementById("refresh-btn");
      const errorBanner = document.getElementById("error-banner");
      btn.classList.add("loading");
      btn.textContent = "Loading...";
      errorBanner.style.display = "none";

      try {
        const res = await fetch("/api/news");
        if (!res.ok) throw new Error("Server returned " + res.status);
        const data = await res.json();

        allArticles = data.articles || [];

        document.getElementById("article-count").textContent = data.totalArticles;
        document.getElementById("feed-count").textContent = data.feedsScanned;
        document.getElementById("last-updated").textContent = new Date(
          data.lastUpdated
        ).toLocaleTimeString();

        applyFilter();
      } catch (err) {
        console.error("Failed to load news:", err);
        errorBanner.textContent =
          "Failed to fetch news updates. Some feeds may be unavailable. " +
          err.message;
        errorBanner.style.display = "block";

        const main = document.getElementById("main");
        if (allArticles.length === 0) {
          main.innerHTML = `
            <div class="empty-state">
              <h3>Unable to reach news feeds</h3>
              <p>There was a problem connecting to the news sources. Please try refreshing in a moment.</p>
            </div>`;
        }
      } finally {
        btn.classList.remove("loading");
        btn.textContent = "Refresh";
      }
    }

    function applyFilter() {
      let filtered = allArticles;
      if (currentFilter !== "all") {
        filtered = allArticles.filter((a) => a.category === currentFilter);
      }
      renderTimeline(filtered);
    }

    // Filter chips
    document.getElementById("filter-bar").addEventListener("click", (e) => {
      const chip = e.target.closest(".filter-chip");
      if (!chip) return;

      document
        .querySelectorAll(".filter-chip")
        .forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      currentFilter = chip.dataset.filter;
      applyFilter();
    });

    // Initial load
    loadNews();

    // Auto-refresh every 5 minutes
    setInterval(loadNews, 5 * 60 * 1000);
  </script>
</body>
</html>
