[project]
name = "agenticos-control-plane"
version = "0.1.0"
description = "AgenticOS Cockpit control plane — local-first, provider-independent agent command center"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jsonschema>=4.23",
    "pyyaml>=6.0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1.0"]
mcp = ["mcp>=1.1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "respx>=0.21",
    "claude-agent-sdk>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "B008",     # FastAPI Depends() in defaults is idiomatic
    "ASYNC109", # timeout params wrap asyncio.wait_for internally — deliberate API shape
    "ASYNC240", # local-first app: tiny local Path IO on the loop is an accepted trade-off
    "RUF001", "RUF002", "RUF003",  # typographic dashes/quotes in strings are intentional
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["cockpit"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
