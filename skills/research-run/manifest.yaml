id: research-run
name: Research Run
description: A source-honest research memo separating facts, inferences, and unknowns. Needs a healthy model provider; states its evidence limits (no web browsing connector in the MVP).
version: 0.1.0
domains: [knowledge, work, ventures]
risk_level: R1
default_autonomy: 3
required_connectors: []
allowed_tools: []
supports_schedule: false
supports_dry_run: true
timeout_seconds: 240
max_steps: 5
verification_rules:
  - artifact_exists:markdown
input_schema:
  type: object
  properties:
    question: { type: string, minLength: 5 }
  required: [question]
output_schema:
  type: object
  properties:
    question: { type: string }
    mode: { type: string }
  required: [question, mode]
